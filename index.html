<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本の美、和菓子の世界</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero-section">
        <div class="hero-content">
            <h1>日本の伝統、和菓子の世界</h1>
            <p>五感で味わう、四季折々の美しさと歴史</p>
            <a href="sub.html" class="btn">和菓子を知る</a>
        </div>
    </header>

    <main class="container">
        <section class="intro">
            <h2>和菓子とは</h2>
            <p>和菓子は単なる菓子ではなく、日本の四季、自然、そして文学を映し出す「食べられる芸術」です。その一品一品には、職人の技と、もてなしの心が込められています。</p>
        </section>

        <section class="features">
            <div class="feature-card">
                <div class="icon">🌸</div>
                <h3>四季の移ろい</h3>
                <p>春の桜、夏の涼、秋の紅葉、冬の雪。季節の美しさをそのまま形にします。</p>
            </div>
            <div class="feature-card">
                <div class="icon">🍵</div>
                <h3>茶道との繋がり</h3>
                <p>お茶の味を引き立てるため、甘みや食感、見た目の調和が計算されています。</p>
            </div>
            <div class="feature-card">
                <div class="icon">🎑</div>
                <h3>伝統の技</h3>
                <p>何百年もの間、職人から職人へと受け継がれてきた繊細な技術の結晶です。</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 日本の伝統美 - 和菓子紀行</p>
    </footer>
</body>
</html>
